name: Validate call email controls
on:
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test --test-concurrency=1 tests/*.test.mjs
      - run: npm run lint
      - run: npx tsc --noEmit --target es2022 --module esnext --moduleResolution bundler --types node --skipLibCheck netlify/functions/*.ts netlify/lib/*.ts
      - run: npm run build
