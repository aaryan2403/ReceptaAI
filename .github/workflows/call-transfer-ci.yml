name: Validate Recepta call transfer

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/existing-number-onboarding]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run phone setup and existing regression tests
        run: node --test --test-concurrency=1 tests/*.test.mjs
      - name: Lint with zero warnings
        run: npm run lint
      - name: Check telephony backend types
        run: npx tsc --noEmit --target es2022 --module esnext --moduleResolution bundler --types node --skipLibCheck netlify/functions/phone-setup.ts netlify/functions/retell-phone-tools.ts netlify/functions/create-checkout-session.ts netlify/functions/stripe-webhook.ts netlify/functions/callback-requests.ts netlify/functions/admin-link-phone.ts netlify/functions/retell-inbound.ts netlify/functions/retell-webhook.ts netlify/functions/client-calls.ts netlify/functions/create-client.ts netlify/functions/update-client-agent.ts netlify/functions/update-clients.ts
      - name: Compile production application
        run: npm run build
